name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Certifique-se de que sua branch se chama 'main'. Se for 'master', mude aqui.

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Atualizado para v4

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Atualizado para v4
        with:
          node-version: 20 # Usando uma versão estável e atual do Node
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5 # Atualizado para v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # Atualizado para v3 (Correção do erro que você recebeu)
        with:
          path: './dist' # O Vite gera a pasta dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Atualizado para v4
